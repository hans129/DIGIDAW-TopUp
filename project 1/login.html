<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Digidaw TopUp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">Digidaw TopUp</a>
      <a href="index.html" class="btn btn-outline-light btn-sm">Beranda</a>
    </div>
  </nav>

  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card auth-card p-4">
          <h4 class="text-center fw-bold mb-1">Login Akun</h4>
          <p class="text-center text-muted small mb-4">Masuk sebagai Member atau Admin</p>
          <div id="alert-box" class="alert alert-danger py-2 small d-none">Username atau Password salah!</div>
          <form onsubmit="validasiLogin(event)">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Username</label>
              <input type="text" id="username" class="form-control" placeholder="user / admin" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Password</label>
              <input type="password" id="password" class="form-control" placeholder="12345" required>
            </div>
            <button type="submit" class="btn btn-gaming w-100 mt-2">Login</button>
          </form>
          <p class="text-center mt-3 mb-0 small text-muted">Belum punya akun? <a href="register.html" class="text-decoration-none fw-semibold">Registrasi</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-custom text-center py-3 mt-auto">
    <div class="container">
      <small>@Copyright by 24552011050_Irpan Nurohman_TIFRP 24E CNS</small>
    </div>
  </footer>

  <script>
    function validasiLogin(event) {
      event.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      const regUser = localStorage.getItem("registeredUser");
      const regPass = localStorage.getItem("registeredPass");

      // Struktur Percabangan If
      if (user === "admin" && pass === "12345") {
        localStorage.setItem("activeUser", "Admin");
        localStorage.setItem("userRole", "admin");
        window.location.href = "dashboard.html";
      } else if ((user === "user" && pass === "12345") || (user === regUser && pass === regPass)) {
        localStorage.setItem("activeUser", user);
        localStorage.setItem("userRole", "user");
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("alert-box").classList.remove("d-none");
      }
    }
  </script>
</body>
</html>
