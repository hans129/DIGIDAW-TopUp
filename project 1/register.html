<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi - Digidaw TopUp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">Digidaw TopUp</a>
      <a href="index.html" class="btn btn-outline-light btn-sm">Beranda</a>
    </div>
  </nav>

  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card auth-card p-4">
          <h4 class="text-center fw-bold mb-1">Registrasi Akun Baru</h4>
          <p class="text-center text-muted small mb-4">Buat akun member PT Digidaw TopUp Digital</p>
          <form onsubmit="prosesRegister(event)">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Nama Lengkap</label>
              <input type="text" id="reg-nama" class="form-control" placeholder="Contoh: Irpan Nurohman" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Username</label>
              <input type="text" id="reg-user" class="form-control" placeholder="Buat username" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Password</label>
              <input type="password" id="reg-pass" class="form-control" placeholder="Buat password" required>
            </div>
            <button type="submit" class="btn btn-gaming w-100 mt-2">Daftar Sekarang</button>
          </form>
          <p class="text-center mt-3 mb-0 small text-muted">Sudah punya akun? <a href="login.html" class="text-decoration-none fw-semibold">Login</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-custom text-center py-3 mt-auto">
    <div class="container">
      <small>@Copyright by 24552011050_Irpan Nurohman_TIFRP 24E CNS</small>
    </div>
  </footer>

  <script>
    function prosesRegister(event) {
      event.preventDefault();
      const user = document.getElementById("reg-user").value;
      const pass = document.getElementById("reg-pass").value;

      localStorage.setItem("registeredUser", user);
      localStorage.setItem("registeredPass", pass);

      alert("Registrasi berhasil! Silakan login menggunakan username: " + user);
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
