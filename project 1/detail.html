<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Informasi - Digidaw TopUp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">Digidaw TopUp</a>
      <a href="index.html" class="btn btn-outline-light btn-sm">&larr; Kembali ke Halaman Utama</a>
    </div>
  </nav>

  <main class="container my-5">
    <div class="card detail-card p-4 p-md-5" id="detail-container"></div>
  </main>

  <footer class="footer-custom text-center py-3 mt-auto">
    <div class="container">
      <small>@Copyright by 24552011050_Irpan Nurohman_TIFRP 24E CNS</small>
    </div>
  </footer>

  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get("id")) || 1;
    const savedGames = JSON.parse(localStorage.getItem("katalogGame")) || dataGame;
    const item = savedGames.find(g => g.id === id);

    const detailContainer = document.getElementById("detail-container");
    if (item) {
      detailContainer.innerHTML = `
        <div class="row g-4 align-items-center">
          <div class="col-md-5">
            <img src="${item.gambar}" class="img-fluid rounded-4 shadow-sm" alt="${item.nama}">
          </div>
          <div class="col-md-7">
            <span class="badge bg-primary mb-2 px-3 py-2">${item.kategori}</span>
            <h2 class="fw-bold mb-2">${item.nama}</h2>
            <p class="text-success fw-bold fs-5 mb-3">Harga Mulai: ${item.hargaMulai}</p>
            <hr>
            <h6 class="fw-bold text-uppercase text-muted small">Informasi Lengkap Layanan</h6>
            <p class="lh-lg">${item.detailLengkap}</p>
            <div class="d-flex gap-2 mt-4">
              <a href="login.html" class="btn btn-gaming px-4">Login untuk Top Up Sekarang</a>
              <a href="index.html" class="btn btn-outline-secondary">Lihat Layanan Lain</a>
            </div>
          </div>
        </div>
      `;
    } else {
      detailContainer.innerHTML = `<p class="text-danger mb-0">Informasi layanan tidak ditemukan.</p>`;
    }
  </script>
</body>
</html>
